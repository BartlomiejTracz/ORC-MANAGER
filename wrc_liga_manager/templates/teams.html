{% extends "base.html" %}
{% block title %}Teams - {{ champ.name }}{% endblock %}
{% block content %}
<h1 class="page-header">🏁 Team Management</h1>

<div class="card" style="border-top: 4px solid #a87ffb; margin-bottom: 30px;">
    <h2 class="card-title">Add New Team</h2>
    <form action="/c/{{ champ.id }}/add_team" method="POST" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
        <div style="flex: 1; min-width: 150px;">
            <label style="display:block; margin-bottom: 5px; color: #64748b; font-weight: 500;">Team Name</label>
            <input type="text" name="name" required style="width:100%; padding: 10px; border-radius: 4px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; box-sizing: border-box;" placeholder="e.g. Toyota Gazoo Racing">
        </div>
        <div style="flex: 1; min-width: 150px;">
            <label style="display:block; margin-bottom: 5px; color: #64748b; font-weight: 500;">Car</label>
            <input type="text" name="car" list="car-list" required style="width:100%; padding: 10px; border-radius: 4px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; box-sizing: border-box;" placeholder="e.g. Toyota GR Yaris Rally1">
        </div>
        <div style="width: 80px;">
            <label style="display:block; margin-bottom: 5px; color: #64748b; font-weight: 500;">Main</label>
            <input type="color" name="color_hex" value="#ff0000" style="width:100%; height: 42px; padding: 2px; border-radius: 4px; border: 1px solid #cbd5e1; background: #ffffff; cursor: pointer; box-sizing: border-box;">
        </div>
        <div style="width: 80px;">
            <label style="display:block; margin-bottom: 5px; color: #64748b; font-weight: 500;">Border</label>
            <input type="color" name="color_border_hex" value="#990000" style="width:100%; height: 42px; padding: 2px; border-radius: 4px; border: 1px solid #cbd5e1; background: #ffffff; cursor: pointer; box-sizing: border-box;">
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; min-width: 130px; padding-left: 10px;">
            <input type="checkbox" name="is_factory" id="is_factory" value="true" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="is_factory" style="color: #0f172a; font-weight: 600; cursor: pointer;">Factory Team</label>
        </div>
        <button type="submit" class="btn btn-primary" style="padding: 10px 24px; font-weight: bold; height: 42px;">➕ Add</button>
    </form>
</div>

<div class="card">
    <div class="table-responsive">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th style="padding: 14px; text-align: left; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 600;">ID</th>
                    <th style="padding: 14px; text-align: left; border-bottom: 2px solid #e2e8f0; color: #64748b; width: 100px; font-weight: 600;">Colors</th>
                    <th style="padding: 14px; text-align: left; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 600;">Team Name</th>
                    <th style="padding: 14px; text-align: left; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 600;">Car</th>
                    <th style="padding: 14px; text-align: center; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 600;">Factory?</th>
                    <th style="padding: 14px; text-align: right; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 600;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for t in teams %}
                <tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 14px; vertical-align: middle; color: #0f172a;"><strong>{{ t.id }}</strong></td>
                    <td style="padding: 14px; vertical-align: middle;">
                        <input type="color" name="color_hex" value="{{ t.color_hex }}" form="form-edit-{{ t.id }}" style="width: 32px; height: 32px; border: 1px solid #cbd5e1; border-radius: 4px; padding: 0; cursor: pointer; background: #fff;">
                        <input type="color" name="color_border_hex" value="{{ t.color_border_hex }}" form="form-edit-{{ t.id }}" style="width: 32px; height: 32px; border: 1px solid #cbd5e1; border-radius: 4px; padding: 0; cursor: pointer; background: #fff; margin-left: 5px;">
                    </td>
                    <td style="padding: 14px; vertical-align: middle;">
                        <input type="text" name="name" value="{{ t.name }}" form="form-edit-{{ t.id }}" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #cbd5e1; box-sizing: border-box; background: #ffffff; color: #0f172a; font-weight: 500;">
                    </td>
                    <td style="padding: 14px; vertical-align: middle;">
                        <input type="text" name="car" list="car-list" value="{{ t.car }}" form="form-edit-{{ t.id }}" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #cbd5e1; box-sizing: border-box; background: #ffffff; color: #0f172a;">
                    </td>
                    <td style="padding: 14px; text-align: center; vertical-align: middle;">
                        <input type="checkbox" name="is_factory" value="true" form="form-edit-{{ t.id }}" {% if t.is_factory %}checked{% endif %} style="width: 20px; height: 20px; cursor: pointer;">
                    </td>
                    <td style="padding: 14px; vertical-align: middle;">
                        <div style="display: flex; gap: 8px; justify-content: flex-end;">
                            <form id="form-edit-{{ t.id }}" action="/c/{{ champ.id }}/update_team/{{ t.id }}" method="POST" style="margin:0;">
                                <button type="submit" class="btn btn-success" style="padding: 10px 16px; font-weight: bold; border-radius: 5px;">Save</button>
                            </form>
                            <form action="/c/{{ champ.id }}/delete_team/{{ t.id }}" method="POST" onsubmit="return confirm('Delete team permanently?');" style="margin:0;">
                                <button type="submit" class="btn btn-danger" style="padding: 10px 16px; font-weight: bold; border-radius: 5px;">Del</button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6" style="padding: 30px; text-align: center; color: #64748b; font-size: 1.1rem;">No teams added yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<datalist id="car-list">
    {% for c in unique_cars %}
        <option value="{{ c }}">
    {% endfor %}
    <option value="Toyota GR Yaris Rally1">
    <option value="Hyundai i20 N Rally1">
    <option value="Ford Puma Rally1">
    <option value="Skoda Fabia RS Rally2">
    <option value="Skoda Fabia Rally2 evo">
    <option value="Toyota GR Yaris Rally2">
    <option value="Hyundai i20 N Rally2">
    <option value="Citroen C3 Rally2">
    <option value="Ford Fiesta Rally2">
    <option value="VW Polo GTI R5">
    <option value="Ford Fiesta Rally3">
    <option value="Renault Clio Rally3">
    <option value="Peugeot 208 Rally4">
    <option value="Ford Fiesta Rally4">
    <option value="Subaru Impreza WRC">
    <option value="Mitsubishi Lancer WRC">
    <option value="Ford Focus RS WRC">
    <option value="Citroen C4 WRC">
    <option value="Peugeot 206 WRC">
</datalist>
{% endblock %}
